    box-shadow 150ms;

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

  background: linear-gradient(

  height: 20px;
  margin-top: 4px;

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;zero-vote-lab&quot;&gt;
  &lt;div class=&quot;zvl-toolbar&quot;&gt;
    &lt;button id=&quot;zvl-run&quot; class=&quot;btn btn-primary&quot; type=&quot;button&quot;&gt;运行&lt;/button&gt;
    &lt;button id=&quot;zvl-step&quot; class=&quot;btn&quot; type=&quot;button&quot;&gt;单步&lt;/button&gt;
    &lt;button id=&quot;zvl-apply&quot; class=&quot;btn&quot; type=&quot;button&quot;&gt;应用修改（保留进度）&lt;/button&gt;
    &lt;button id=&quot;zvl-reset&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot;&gt;按当前参数重置&lt;/button&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;zvl-speed&quot;&gt;
      播放速度
      &lt;select id=&quot;zvl-speed&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;450&quot;&gt;慢速&lt;/option&gt;
        &lt;option value=&quot;140&quot; selected&gt;正常&lt;/option&gt;
        &lt;option value=&quot;35&quot;&gt;快速&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;span id=&quot;zvl-apply-note&quot; class=&quot;text-small text-muted&quot;&gt;中途修改倍数、比例或自然票率后，点击“应用修改”。&lt;/span&gt;
  &lt;/div&gt;

  &lt;details class=&quot;zvl-parameters&quot;&gt;
    &lt;summary&gt;参数设置（已载入默认值）&lt;/summary&gt;

    &lt;div class=&quot;zvl-section-label&quot;&gt;票量与阶段&lt;/div&gt;
    &lt;div class=&quot;zvl-fields&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-start-ratio&quot;&gt;初始倍数
        &lt;input id=&quot;zvl-start-ratio&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-peak-ratio&quot;&gt;峰值倍数
        &lt;input id=&quot;zvl-peak-ratio&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;10&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-final-ratio&quot;&gt;最终倍数
        &lt;input id=&quot;zvl-final-ratio&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;4&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-rise-seconds&quot;&gt;升至峰值用时（秒）
        &lt;input id=&quot;zvl-rise-seconds&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;60&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-trigger-rank&quot;&gt;开始下降的赛罗名次
        &lt;select id=&quot;zvl-trigger-rank&quot; class=&quot;form-select&quot;&gt;
          &lt;option value=&quot;none&quot;&gt;无（按保持时间）&lt;/option&gt;
          &lt;option value=&quot;2&quot;&gt;第2名&lt;/option&gt;
          &lt;option value=&quot;3&quot;&gt;第3名&lt;/option&gt;
          &lt;option value=&quot;4&quot;&gt;第4名&lt;/option&gt;
          &lt;option value=&quot;5&quot;&gt;第5名&lt;/option&gt;
          &lt;option value=&quot;6&quot;&gt;第6名&lt;/option&gt;
          &lt;option value=&quot;7&quot; selected&gt;第7名&lt;/option&gt;
        &lt;/select&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-peak-hold-seconds&quot;&gt;峰值保持时间（秒）
        &lt;input id=&quot;zvl-peak-hold-seconds&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-fall-seconds&quot;&gt;下降用时（秒）
        &lt;input id=&quot;zvl-fall-seconds&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;60&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-seed&quot;&gt;随机种子
        &lt;input id=&quot;zvl-seed&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;20260727&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-window&quot;&gt;图表窗口（秒）
        &lt;input id=&quot;zvl-window&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;60&quot; step=&quot;30&quot; value=&quot;300&quot;&gt;
      &lt;/label&gt;
    &lt;/div&gt;

    &lt;div class=&quot;zvl-section-label&quot;&gt;路人票分配比例：普通策略&lt;/div&gt;
    &lt;div class=&quot;zvl-fields&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-before-ahead-near&quot;&gt;前一名（%）
        &lt;input id=&quot;zvl-before-ahead-near&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;40&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-before-behind-near&quot;&gt;后一名（%）
        &lt;input id=&quot;zvl-before-behind-near&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;40&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-before-ahead-rest&quot;&gt;前方其余（%）
        &lt;input id=&quot;zvl-before-ahead-rest&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-before-behind-rest&quot;&gt;后方其余（%）
        &lt;input id=&quot;zvl-before-behind-rest&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;
      &lt;/label&gt;
    &lt;/div&gt;

    &lt;div class=&quot;zvl-section-label&quot;&gt;路人票分配比例：反超防御策略&lt;/div&gt;
    &lt;div class=&quot;zvl-fields&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-after-ahead-near&quot;&gt;前一名（%）
        &lt;input id=&quot;zvl-after-ahead-near&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;40&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-after-behind-near&quot;&gt;后一名（%）
        &lt;input id=&quot;zvl-after-behind-near&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;20&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-after-ahead-rest&quot;&gt;前方其余（%）
        &lt;input id=&quot;zvl-after-ahead-rest&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;35&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;zvl-after-behind-rest&quot;&gt;后方其余（%）
        &lt;input id=&quot;zvl-after-behind-rest&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;
      &lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;text-small text-muted&quot;&gt;程序记录赛罗到达过的最低名次；赛罗从该名次反超一位后，下一秒起永久切换为防御策略。每秒开始时冻结排名，空组票流向子集外。&lt;/div&gt;

    &lt;div class=&quot;zvl-section-label&quot;&gt;各角色初始票数与自然票率&lt;/div&gt;
    &lt;div class=&quot;zvl-character-head text-small text-muted&quot;&gt;
      &lt;span&gt;角色&lt;/span&gt;&lt;span&gt;初始票数&lt;/span&gt;&lt;span&gt;自然票/秒&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;zvl-character-inputs&quot;&gt;&lt;/div&gt;
  &lt;/details&gt;

  &lt;div class=&quot;viz-grid zvl-stats&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;路人票／赛罗自然票&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot;&gt;&lt;span id=&quot;zvl-ratio&quot;&gt;1.0&lt;/span&gt; 倍&lt;/div&gt;
      &lt;div class=&quot;text-small text-muted&quot;&gt;第 &lt;span id=&quot;zvl-time&quot;&gt;0&lt;/span&gt; 秒&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;赛罗名次&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot;&gt;第 &lt;span id=&quot;zvl-rank&quot;&gt;1&lt;/span&gt; 名&lt;/div&gt;
      &lt;div class=&quot;text-small text-muted&quot; id=&quot;zvl-trigger-note&quot;&gt;尚未触发下降&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;赛罗前方奥特曼最大票差&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot;&gt;&lt;span id=&quot;zvl-gap&quot;&gt;0&lt;/span&gt; 票&lt;/div&gt;
      &lt;div class=&quot;text-small text-muted&quot;&gt;最高票角色 − 赛罗前一名&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;zvl-status&quot;&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;zvl-phase&quot;&gt;增长阶段&lt;/span&gt;
    &lt;span class=&quot;text-muted&quot; id=&quot;zvl-last-allocation&quot;&gt;点击“运行”开始仿真。&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;zvl-main&quot;&gt;
    &lt;section aria-labelledby=&quot;zvl-race-title&quot;&gt;
      &lt;h3 id=&quot;zvl-race-title&quot; class=&quot;sr-only&quot;&gt;实时票数排名&lt;/h3&gt;
      &lt;div id=&quot;zvl-bars&quot; role=&quot;img&quot; aria-label=&quot;七名角色实时票数排名&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;zvl-chart-wrap&quot; aria-labelledby=&quot;zvl-chart-heading&quot;&gt;
      &lt;h3 id=&quot;zvl-chart-heading&quot; class=&quot;sr-only&quot;&gt;七名奥特曼真实票数&lt;/h3&gt;
      &lt;svg id=&quot;zvl-chart&quot; class=&quot;zvl-chart&quot; viewBox=&quot;0 0 700 270&quot; role=&quot;img&quot; aria-labelledby=&quot;zvl-chart-title zvl-chart-desc&quot;&gt;
        &lt;title id=&quot;zvl-chart-title&quot;&gt;七名奥特曼真实票数&lt;/title&gt;
        &lt;desc id=&quot;zvl-chart-desc&quot;&gt;细线为其他六名奥特曼的真实票数，粗线为赛罗的真实票数。&lt;/desc&gt;
        &lt;g id=&quot;zvl-grid&quot;&gt;&lt;/g&gt;
        &lt;g id=&quot;zvl-markers&quot;&gt;&lt;/g&gt;
        &lt;text class=&quot;zvl-axis-label text-small&quot; x=&quot;58&quot; y=&quot;16&quot;&gt;真实票数（票）&lt;/text&gt;
        &lt;g id=&quot;zvl-lines&quot;&gt;&lt;/g&gt;
        &lt;path id=&quot;zvl-min-line&quot; class=&quot;zvl-min-line&quot; d=&quot;&quot;&gt;&lt;/path&gt;
        &lt;circle id=&quot;zvl-end-dot&quot; class=&quot;zvl-end-dot&quot; cx=&quot;58&quot; cy=&quot;132&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;
        &lt;text id=&quot;zvl-end-label&quot; class=&quot;zvl-end-label text-small&quot; x=&quot;65&quot; y=&quot;124&quot;&gt;赛罗&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;zvl-legend text-small&quot;&gt;
        &lt;span&gt;&lt;span class=&quot;zvl-swatch zvl-wall-swatch&quot;&gt;&lt;/span&gt;其他六名奥特曼&lt;/span&gt;
        &lt;span&gt;&lt;span class=&quot;zvl-swatch zvl-min-swatch&quot;&gt;&lt;/span&gt;赛罗&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #zero-vote-lab {
    color: var(--foreground);
    width: 100%;
  }

  #zero-vote-lab .zvl-toolbar,
  #zero-vote-lab .zvl-status {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  #zero-vote-lab .zvl-parameters {
    margin: 14px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  #zero-vote-lab .zvl-parameters summary {
    cursor: pointer;
    font-weight: 500;
    margin-bottom: 12px;
  }

  #zero-vote-lab .zvl-section-label {
    font-weight: 500;
    margin: 14px 0 8px;
  }

  #zero-vote-lab .zvl-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 14px;
  }

  #zero-vote-lab .zvl-character-head,
  #zero-vote-lab .zvl-character-row {
    display: grid;
    grid-template-columns: minmax(72px, 1fr) minmax(90px, 1fr) minmax(90px, 1fr);
    gap: 10px;
    align-items: center;
  }

  #zero-vote-lab .zvl-character-head {
    margin-bottom: 6px;
  }

  #zero-vote-lab .zvl-character-row {
    margin-bottom: 7px;
  }

  #zero-vote-lab .zvl-stats {
    margin: 14px 0 10px;
  }

  #zero-vote-lab .zvl-status {
    margin-bottom: 14px;
  }

  #zero-vote-lab .zvl-main {
    display: grid;
    grid-template-columns: minmax(250px, 0.8fr) minmax(390px, 1.2fr);
    gap: 24px;
    align-items: start;
  }

  #zero-vote-lab .zvl-bar-row {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) 122px;
    gap: 8px;
    align-items: center;
    min-height: 34px;
  }

  #zero-vote-lab .zvl-name,
  #zero-vote-lab .zvl-votes {
    white-space: nowrap;
  }

  #zero-vote-lab .zvl-votes {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #zero-vote-lab .zvl-track {
    height: 12px;
    background: color-mix(in srgb, var(--muted) 55%, transparent);
    overflow: hidden;
  }

  #zero-vote-lab .zvl-fill {
    display: block;
    height: 100%;
    background: var(--viz-series-2);
    transition: width 130ms ease;
  }

  #zero-vote-lab .zvl-bar-row.is-zero .zvl-fill {
    background: var(--viz-series-1);
  }

  #zero-vote-lab .zvl-bar-row.is-target .zvl-fill {
    background: var(--viz-series-3);
  }

  #zero-vote-lab .zvl-chart-wrap {
    min-width: 0;
  }

  #zero-vote-lab .zvl-chart {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  #zero-vote-lab .zvl-grid-line,
  #zero-vote-lab .zvl-marker-line {
    stroke: var(--border);
    stroke-width: 1;
  }

  #zero-vote-lab .zvl-grid-text,
  #zero-vote-lab .zvl-axis-label,
  #zero-vote-lab .zvl-marker-text,
  #zero-vote-lab .zvl-end-label {
    fill: var(--muted-foreground);
  }

  #zero-vote-lab .zvl-zero-line {
    stroke: var(--foreground);
    stroke-width: 1.5;
  }

  #zero-vote-lab .zvl-wall-line {
    fill: none;
    stroke: var(--viz-series-2);
    stroke-width: 1;
    opacity: 0.36;
  }

  #zero-vote-lab .zvl-min-line {
    fill: none;
    stroke: var(--viz-series-3);
    stroke-width: 3;
  }

  #zero-vote-lab .zvl-end-dot {
    fill: var(--viz-series-3);
  }

  #zero-vote-lab .zvl-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    color: var(--muted-foreground);
  }

  #zero-vote-lab .zvl-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  #zero-vote-lab .zvl-swatch {
    display: inline-block;
    width: 22px;
    height: 3px;
  }

  #zero-vote-lab .zvl-wall-swatch {
    background: var(--viz-series-2);
    opacity: 0.5;
  }

  #zero-vote-lab .zvl-min-swatch {
    background: var(--viz-series-3);
  }

  #zero-vote-lab .zvl-zero-swatch {
    display: inline-block;
    width: 22px;
    height: 1px;
    background: var(--foreground);
  }

  @media (max-width: 680px) {
    #zero-vote-lab .zvl-main {
      grid-template-columns: 1fr;
    }

    #zero-vote-lab .zvl-fields {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 430px) {
    #zero-vote-lab .zvl-fields {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #zero-vote-lab .zvl-fill {
      transition: none;
    }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;zero-vote-lab&#x27;);
  const names = [&#x27;泽塔&#x27;, &#x27;银河&#x27;, &#x27;戴拿&#x27;, &#x27;奈克赛斯&#x27;, &#x27;盖亚&#x27;, &#x27;欧布&#x27;, &#x27;赛罗&#x27;];
  const defaultVotes = [1005, 1004, 1003, 1002, 1001, 1000, 1030];
  const defaultRates = [1.5, 1.2, 0.9, 0.6, 0.3, 0.0, 4.5];
  const characterInputsEl = root.querySelector(&#x27;#zvl-character-inputs&#x27;);
  const barsEl = root.querySelector(&#x27;#zvl-bars&#x27;);
  const gridEl = root.querySelector(&#x27;#zvl-grid&#x27;);
  const linesEl = root.querySelector(&#x27;#zvl-lines&#x27;);
  const markersEl = root.querySelector(&#x27;#zvl-markers&#x27;);
  const minLineEl = root.querySelector(&#x27;#zvl-min-line&#x27;);
  const endDotEl = root.querySelector(&#x27;#zvl-end-dot&#x27;);
  const endLabelEl = root.querySelector(&#x27;#zvl-end-label&#x27;);
  const runEl = root.querySelector(&#x27;#zvl-run&#x27;);
  const stepEl = root.querySelector(&#x27;#zvl-step&#x27;);
  const applyEl = root.querySelector(&#x27;#zvl-apply&#x27;);
  const applyNoteEl = root.querySelector(&#x27;#zvl-apply-note&#x27;);
  const resetEl = root.querySelector(&#x27;#zvl-reset&#x27;);
  const speedEl = root.querySelector(&#x27;#zvl-speed&#x27;);

  let params;
  let votes;
  let tick;
  let rngState;
  let currentRatio;
  let declineStart;
  let history;
  let allocations;
  let lostRouteVotes;
  let lastDeltas;
  let worstZeroRank;
  let defenseActive;
  let defenseStart;
  let timer = null;

  function buildCharacterInputs() {
    characterInputsEl.innerHTML = names.map((name, index) =&gt; `
      &lt;div class=&quot;zvl-character-row&quot;&gt;
        &lt;span&gt;${name}&lt;/span&gt;
        &lt;input id=&quot;zvl-vote-${index}&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;${defaultVotes[index]}&quot; aria-label=&quot;${name}初始票数&quot;&gt;
        &lt;input id=&quot;zvl-rate-${index}&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.1&quot; value=&quot;${defaultRates[index]}&quot; aria-label=&quot;${name}自然票每秒&quot;&gt;
      &lt;/div&gt;
    `).join(&#x27;&#x27;);
  }

  function numberValue(id, fallback, minimum = 0) {
    const value = Number(root.querySelector(id).value);
    return Number.isFinite(value) ? Math.max(minimum, value) : fallback;
  }

  function readParams() {
    const triggerRankValue = root.querySelector(&#x27;#zvl-trigger-rank&#x27;).value;
    return {
      initialVotes: names.map((name, index) =&gt; numberValue(`#zvl-vote-${index}`, defaultVotes[index], 0)),
      naturalRates: names.map((name, index) =&gt; numberValue(`#zvl-rate-${index}`, defaultRates[index], 0)),
      startRatio: numberValue(&#x27;#zvl-start-ratio&#x27;, 1, 0),
      peakRatio: numberValue(&#x27;#zvl-peak-ratio&#x27;, 10, 0),
      finalRatio: numberValue(&#x27;#zvl-final-ratio&#x27;, 4, 0),
      riseSeconds: numberValue(&#x27;#zvl-rise-seconds&#x27;, 60, 1),
      triggerRank: triggerRankValue === &#x27;none&#x27;
        ? null
        : Math.min(7, numberValue(&#x27;#zvl-trigger-rank&#x27;, 7, 2)),
      peakHoldSeconds: numberValue(&#x27;#zvl-peak-hold-seconds&#x27;, 0, 0),
      fallSeconds: numberValue(&#x27;#zvl-fall-seconds&#x27;, 60, 1),
      ordinaryWeights: [
        Math.min(100, numberValue(&#x27;#zvl-before-ahead-near&#x27;, 40, 0)),
        Math.min(100, numberValue(&#x27;#zvl-before-behind-near&#x27;, 40, 0)),
        Math.min(100, numberValue(&#x27;#zvl-before-ahead-rest&#x27;, 10, 0)),
        Math.min(100, numberValue(&#x27;#zvl-before-behind-rest&#x27;, 10, 0))
      ],
      defenseWeights: [
        Math.min(100, numberValue(&#x27;#zvl-after-ahead-near&#x27;, 40, 0)),
        Math.min(100, numberValue(&#x27;#zvl-after-behind-near&#x27;, 20, 0)),
        Math.min(100, numberValue(&#x27;#zvl-after-ahead-rest&#x27;, 35, 0)),
        Math.min(100, numberValue(&#x27;#zvl-after-behind-rest&#x27;, 5, 0))
      ],
      seed: Math.floor(numberValue(&#x27;#zvl-seed&#x27;, 20260727, 1)),
      chartWindow: numberValue(&#x27;#zvl-window&#x27;, 300, 60)
    };
  }

  function random() {
    rngState = (rngState * 1664525 + 1013904223) &gt;&gt;&gt; 0;
    return rngState / 4294967296;
  }

  function poisson(lambda) {
    if (lambda &lt;= 0) return 0;
    const limit = Math.exp(-lambda);
    let product = 1;
    let count = 0;
    do {
      count += 1;
      product *= random();
    } while (product &gt; limit);
    return count - 1;
  }

  function ranking() {
    return names.map((name, index) =&gt; ({ name, index, votes: votes[index] }))
      .sort((a, b) =&gt; b.votes - a.votes || a.index - b.index);
  }

  function chooseRandom(indices) {
    return indices[Math.floor(random() * indices.length)];
  }

  function integerQuotas(total, weights) {
    const fixedWeights = weights.map((weight) =&gt; Math.max(0, weight || 0));
    const totalWeight = fixedWeights.reduce((sum, weight) =&gt; sum + weight, 0);
    if (totalWeight &lt;= 0) return fixedWeights.map(() =&gt; 0);
    const exact = fixedWeights.map((weight) =&gt; total * weight / totalWeight);
    const quotas = exact.map((value) =&gt; Math.floor(value));
    let remainder = total - quotas.reduce((sum, value) =&gt; sum + value, 0);
    const remainderOrder = exact.map((value, index) =&gt; ({
      index,
      fraction: value - Math.floor(value)
    })).sort((a, b) =&gt; b.fraction - a.fraction || a.index - b.index);
    for (let index = 0; index &lt; remainder; index += 1) {
      quotas[remainderOrder[index].index] += 1;
    }
    return quotas;
  }

  function groupsFromOrder(order) {
    const zeroPosition = order.indexOf(6);
    const ahead = order.slice(0, zeroPosition).filter((index) =&gt; index &lt; 6);
    const behind = order.slice(zeroPosition + 1).filter((index) =&gt; index &lt; 6);
    return {
      zeroPosition,
      groups: [
        ahead.length ? [ahead[ahead.length - 1]] : [],
        behind.length ? [behind[0]] : [],
        ahead.length &gt; 1 ? ahead.slice(0, -1) : [],
        behind.length &gt; 1 ? behind.slice(1) : []
      ]
    };
  }

  function allocateRouteVotes(routeVotes, orderSnapshot) {
    const { groups } = groupsFromOrder(orderSnapshot);
    const weights = defenseActive ? params.defenseWeights : params.ordinaryWeights;
    const quotas = integerQuotas(routeVotes, weights);

    groups.forEach((members, groupIndex) =&gt; {
      const quota = quotas[groupIndex];
      if (!members.length) {
        lostRouteVotes += quota;
        return;
      }
      if (members.length === 1) {
        const target = members[0];
        votes[target] += quota;
        allocations[target] += quota;
        return;
      }
      for (let vote = 0; vote &lt; quota; vote += 1) {
        const target = chooseRandom(members);
        votes[target] += 1;
        allocations[target] += 1;
      }
    });
  }

  function ratioAt(second) {
    if (second &lt;= params.riseSeconds) {
      const progress = second / params.riseSeconds;
      return params.startRatio + (params.peakRatio - params.startRatio) * progress;
    }
    if (declineStart === null) return params.peakRatio;
    if (second &lt;= declineStart + params.fallSeconds) {
      const progress = (second - declineStart) / params.fallSeconds;
      return params.peakRatio + (params.finalRatio - params.peakRatio) * progress;
    }
    return params.finalRatio;
  }

  function simulateOne() {
    const nextTick = tick + 1;
    currentRatio = ratioAt(nextTick);
    const votesBefore = votes.slice();
    const orderSnapshot = ranking().map((item) =&gt; item.index);

    params.naturalRates.forEach((rate, index) =&gt; {
      votes[index] += poisson(rate);
    });

    allocations = [0, 0, 0, 0, 0, 0];
    lostRouteVotes = 0;
    const zeroNaturalRate = params.naturalRates[6];
    const routeVotes = poisson(currentRatio * zeroNaturalRate);
    allocateRouteVotes(routeVotes, orderSnapshot);
    lastDeltas = votes.map((value, index) =&gt; value - votesBefore[index]);

    tick = nextTick;
    const zeroRank = ranking().findIndex((item) =&gt; item.index === 6) + 1;
    if (zeroRank &gt; worstZeroRank) {
      worstZeroRank = zeroRank;
    } else if (!defenseActive &amp;&amp; zeroRank &lt; worstZeroRank) {
      defenseActive = true;
      defenseStart = tick;
    }
    const holdComplete = tick &gt;= params.riseSeconds + params.peakHoldSeconds;
    const timeOnlyTrigger = params.triggerRank === null &amp;&amp; params.peakHoldSeconds &gt; 0;
    const rankTrigger = params.triggerRank !== null &amp;&amp; zeroRank &gt;= params.triggerRank;
    if (declineStart === null &amp;&amp; holdComplete &amp;&amp; (timeOnlyTrigger || rankTrigger)) {
      declineStart = tick;
    }

    history.push({
      t: tick,
      votes: votes.slice()
    });
    if (history.length &gt; params.chartWindow + 1) history.shift();
    render();
  }

  function pause() {
    if (timer !== null) {
      window.clearInterval(timer);
      timer = null;
    }
    runEl.textContent = &#x27;运行&#x27;;
  }

  function play() {
    if (timer !== null) {
      pause();
      return;
    }
    runEl.textContent = &#x27;暂停&#x27;;
    timer = window.setInterval(simulateOne, Number(speedEl.value));
  }

  function reset() {
    pause();
    params = readParams();
    votes = params.initialVotes.slice();
    tick = 0;
    rngState = params.seed &gt;&gt;&gt; 0;
    currentRatio = params.startRatio;
    declineStart = null;
    allocations = [0, 0, 0, 0, 0, 0];
    lostRouteVotes = 0;
    lastDeltas = [0, 0, 0, 0, 0, 0, 0];
    worstZeroRank = ranking().findIndex((item) =&gt; item.index === 6) + 1;
    defenseActive = false;
    defenseStart = null;
    history = [{
      t: 0,
      votes: votes.slice()
    }];
    applyNoteEl.textContent = &#x27;已按当前参数重置；初始票数和随机种子已载入。&#x27;;
    render();
  }

  function applyLiveParams() {
    pause();
    const updated = readParams();
    params = {
      ...updated,
      initialVotes: params.initialVotes,
      seed: params.seed
    };
    currentRatio = ratioAt(tick);
    if (history.length &gt; params.chartWindow + 1) {
      history = history.slice(-(params.chartWindow + 1));
    }
    applyNoteEl.textContent = `已在第${tick}秒应用；票数、历史和随机序列保持不变。点击“运行”继续。`;
    render();
  }

  function renderBars() {
    const ranked = ranking();
    const minimum = Math.min(...votes);
    const maximum = Math.max(...votes);
    const span = Math.max(1, maximum - minimum);
    const maxAllocation = Math.max(...allocations);

    barsEl.innerHTML = ranked.map((item, rankIndex) =&gt; {
      const width = 35 + (item.votes - minimum) / span * 65;
      const received = item.index &lt; 6 ? allocations[item.index] : 0;
      const isTarget = received &gt; 0 &amp;&amp; received === maxAllocation;
      const classes = [
        &#x27;zvl-bar-row&#x27;,
        item.index === 6 ? &#x27;is-zero&#x27; : &#x27;&#x27;,
        isTarget ? &#x27;is-target&#x27; : &#x27;&#x27;
      ].filter(Boolean).join(&#x27; &#x27;);
      const delta = lastDeltas[item.index];
      return `&lt;div class=&quot;${classes}&quot; aria-label=&quot;第${rankIndex + 1}名，${item.name}，${item.votes}票，上一秒增加${delta}票，本秒路人票${received}&quot;&gt;
        &lt;span class=&quot;zvl-name&quot;&gt;${rankIndex + 1}. ${item.name}&lt;/span&gt;
        &lt;span class=&quot;zvl-track&quot;&gt;&lt;span class=&quot;zvl-fill&quot; style=&quot;width:${width}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;
        &lt;span class=&quot;zvl-votes&quot;&gt;${item.votes.toLocaleString()}（+${delta}）&lt;/span&gt;
      &lt;/div&gt;`;
    }).join(&#x27;&#x27;);
  }

  function pathFor(points, xScale, yScale) {
    return points.map((point, index) =&gt; {
      const command = index === 0 ? &#x27;M&#x27; : &#x27;L&#x27;;
      return `${command}${xScale(point.t).toFixed(1)},${yScale(point.v).toFixed(1)}`;
    }).join(&#x27; &#x27;);
  }

  function renderChart() {
    const allVotes = history.flatMap((entry) =&gt; entry.votes);
    const low = Math.min(...allVotes);
    const high = Math.max(...allVotes);
    const padding = Math.max(5, (high - low) * 0.1);
    const yMin = Math.max(0, low - padding);
    const yMax = high + padding;
    const xMin = Math.max(0, tick - params.chartWindow);
    const xMax = xMin + params.chartWindow;
    const xScale = (value) =&gt; 58 + (value - xMin) / (xMax - xMin) * 624;
    const yScale = (value) =&gt; 228 - (value - yMin) / (yMax - yMin) * 206;

    const ticks = [yMin, (yMin + yMax) / 2, yMax];
    gridEl.innerHTML = ticks.map((value) =&gt; {
      const y = yScale(value);
      return `&lt;line class=&quot;zvl-grid-line&quot; x1=&quot;58&quot; y1=&quot;${y}&quot; x2=&quot;682&quot; y2=&quot;${y}&quot;&gt;&lt;/line&gt;
        &lt;text class=&quot;zvl-grid-text text-small&quot; x=&quot;50&quot; y=&quot;${y + 4}&quot; text-anchor=&quot;end&quot;&gt;${Math.round(value).toLocaleString()}&lt;/text&gt;`;
    }).join(&#x27;&#x27;);

    const markerSpecs = [
      { t: params.riseSeconds, label: `${params.riseSeconds}秒 · 峰值` }
    ];
    if (declineStart !== null) {
      markerSpecs.push({ t: declineStart, label: `${declineStart}秒 · 触发下降` });
      markerSpecs.push({ t: declineStart + params.fallSeconds, label: `${declineStart + params.fallSeconds}秒 · 最终倍数` });
    }
    markersEl.innerHTML = markerSpecs.filter((marker) =&gt; marker.t &gt;= xMin &amp;&amp; marker.t &lt;= xMax).map((marker, index) =&gt; {
      const x = xScale(marker.t);
      const y = index % 2 === 0 ? 250 : 265;
      return `&lt;line class=&quot;zvl-marker-line&quot; x1=&quot;${x}&quot; y1=&quot;22&quot; x2=&quot;${x}&quot; y2=&quot;228&quot;&gt;&lt;/line&gt;
        &lt;text class=&quot;zvl-marker-text text-small&quot; x=&quot;${x}&quot; y=&quot;${y}&quot; text-anchor=&quot;middle&quot;&gt;${marker.label}&lt;/text&gt;`;
    }).join(&#x27;&#x27;);

    linesEl.innerHTML = names.slice(0, 6).map((name, wallIndex) =&gt; {
      const points = history.map((entry) =&gt; ({ t: entry.t, v: entry.votes[wallIndex] }));
      return `&lt;path class=&quot;zvl-wall-line&quot; d=&quot;${pathFor(points, xScale, yScale)}&quot;&gt;&lt;title&gt;${name}真实票数&lt;/title&gt;&lt;/path&gt;`;
    }).join(&#x27;&#x27;);

    const zeroPoints = history.map((entry) =&gt; ({ t: entry.t, v: entry.votes[6] }));
    minLineEl.setAttribute(&#x27;d&#x27;, pathFor(zeroPoints, xScale, yScale));
    const end = zeroPoints[zeroPoints.length - 1];
    const endX = xScale(end.t);
    const endY = yScale(end.v);
    endDotEl.setAttribute(&#x27;cx&#x27;, endX);
    endDotEl.setAttribute(&#x27;cy&#x27;, endY);
    endLabelEl.setAttribute(&#x27;x&#x27;, Math.min(610, endX + 7));
    endLabelEl.setAttribute(&#x27;y&#x27;, Math.max(18, endY - 8));
    endLabelEl.textContent = `赛罗 ${Math.round(end.v).toLocaleString()}票`;
  }

  function render() {
    const ranked = ranking();
    const zeroPosition = ranked.findIndex((item) =&gt; item.index === 6);
    const zeroRank = zeroPosition + 1;
    const aheadOfZero = ranked.slice(0, zeroPosition).filter((item) =&gt; item.index !== 6);
    const maximumAheadGap = aheadOfZero.length &gt; 1
      ? aheadOfZero[0].votes - aheadOfZero[aheadOfZero.length - 1].votes
      : 0;
    const maxAllocation = Math.max(...allocations);
    const topReceivers = names.slice(0, 6).filter((name, index) =&gt; maxAllocation &gt; 0 &amp;&amp; allocations[index] === maxAllocation);

    root.querySelector(&#x27;#zvl-ratio&#x27;).textContent = currentRatio.toFixed(1);
    root.querySelector(&#x27;#zvl-time&#x27;).textContent = tick;
    root.querySelector(&#x27;#zvl-rank&#x27;).textContent = zeroRank;
    root.querySelector(&#x27;#zvl-gap&#x27;).textContent = maximumAheadGap;
    root.querySelector(&#x27;#zvl-trigger-note&#x27;).textContent = params.triggerRank === null
      ? params.peakHoldSeconds === 0
        ? &#x27;无限保持峰值&#x27;
        : `峰值保持${params.peakHoldSeconds}秒后下降`
      : declineStart === null
        ? params.peakHoldSeconds === 0
          ? `到第${params.triggerRank}名后下降`
          : `保持至少${params.peakHoldSeconds}秒，且到第${params.triggerRank}名后下降`
        : `第${declineStart}秒触发下降`;

    const phaseEl = root.querySelector(&#x27;#zvl-phase&#x27;);
    let phaseLabel;
    if (tick &lt; params.riseSeconds) phaseLabel = `增长 · ${params.startRatio}→${params.peakRatio}倍`;
    else if (declineStart === null) phaseLabel = params.triggerRank === null
      ? params.peakHoldSeconds === 0
        ? `保持${params.peakRatio}倍 · 无限`
        : `保持${params.peakRatio}倍 · 共${params.peakHoldSeconds}秒`
      : params.peakHoldSeconds === 0
        ? `保持${params.peakRatio}倍 · 等待第${params.triggerRank}名`
        : `保持${params.peakRatio}倍 · 等待时间和名次条件`;
    else if (tick &lt; declineStart + params.fallSeconds) phaseLabel = `下降 · ${params.peakRatio}→${params.finalRatio}倍`;
    else phaseLabel = `稳定 · ${params.finalRatio}倍`;
    phaseEl.textContent = defenseActive
      ? `${phaseLabel} · 防御策略（第${defenseStart}秒切换）`
      : `${phaseLabel} · 普通策略（最低到第${worstZeroRank}名）`;

    if (topReceivers.length) {
      root.querySelector(&#x27;#zvl-last-allocation&#x27;).textContent =
        `本秒子集内得票最多：${topReceivers.join(&#x27;、&#x27;)}；未进入本子集：${lostRouteVotes}票。`;
    } else if (tick &gt; 0) {
      root.querySelector(&#x27;#zvl-last-allocation&#x27;).textContent =
        `本秒没有路人票进入本子集；流向子集外：${lostRouteVotes}票。`;
    } else {
      root.querySelector(&#x27;#zvl-last-allocation&#x27;).textContent = &#x27;点击“运行”开始仿真。&#x27;;
    }

    renderBars();
    renderChart();
  }

  buildCharacterInputs();
  runEl.addEventListener(&#x27;click&#x27;, play);
  stepEl.addEventListener(&#x27;click&#x27;, simulateOne);
  applyEl.addEventListener(&#x27;click&#x27;, applyLiveParams);
  resetEl.addEventListener(&#x27;click&#x27;, reset);
  speedEl.addEventListener(&#x27;change&#x27;, () =&gt; {
    if (timer !== null) {
      pause();
      play();
    }
  });
  reset();
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
